name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
    # Only trigger build if application or docker config changes
    paths:
      - 'app/**'
      - 'docker/**'
      - 'k8s/**'
      - '.github/workflows/**'
    tags:
      - 'v*' # Trigger when a version tag is pushed (ex: v1.0.1)

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.VERSION }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 1. VERSIONING LOGIC ---
      - name: Determine Version Tag
        id: versioning
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      # --- 2. STATIC ANALYSIS (SAST) ---
      - name: Python Security Scan (Bandit)
        run: |
          pip install bandit
          bandit -r app/

      # --- 3. DOCKER BUILD ---
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-api:${{ steps.versioning.outputs.VERSION }} -f docker/Dockerfile .

      # --- 4. VULNERABILITY SCAN (SCA) ---
      - name: Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/flask-api:${{ steps.versioning.outputs.VERSION }}'
          format: 'table'
          exit-code: '1' # Stop pipeline only if CRITICAL issues are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # --- 5. REGISTRY PUSH ---
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-api:${{ steps.versioning.outputs.VERSION }}

  deploy:
    needs: build-and-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 6. INFRASTRUCTURE SCAN (IaC) ---
      - name: Scan K8s Manifests (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: k8s/
          framework: kubernetes

      # --- 7. K8S UPDATE & DEPLOY ---
      - name: Update Deployment Image Tag
        run: |
          # Dynamically set the new version in the YAML
          sed -i 's|image: .*flask-api:.*|image: ${{ secrets.DOCKER_USERNAME }}/flask-api:${{ needs.build-and-scan.outputs.version }}|g' k8s/deployment.yaml

