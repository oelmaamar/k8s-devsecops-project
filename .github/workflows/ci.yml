name: Build and Deploy

on:
  push:
    branches: [ "deploy-local" ]
    tags:
      - 'v*'
    # Ignore non-technical files to prevent unnecessary deployments
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'test.txt'
  pull_request:
    branches:
      - 'main'
    # Ignore non-technical files to prevent unnecessary deployments
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'test.txt'

jobs:
  build-and-scan:
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 1. STATIC ANALYSIS (SAST) ---
      # Performs Static Application Security Testing using Bandit.
      # This tool scans the source code for vulnerabilities before the build stage.
      # Reference: https://github.com/PyCQA/bandit
      - name: Python Security Scan (Bandit)
        uses: pyupio/bandit-action@master
        with:
          project_path: app/
          level: high
      

      # --- 2. INFRASTRUCTURE AS CODE SCAN (IaC) ---
      # Scans Kubernetes manifests for security misconfigurations using Checkov.
      # Ensures that our K8s deployment follows best practices (e.g., non-root users).
      # Documentation: https://github.com/bridgecrewio/checkov-action

      - name: Scan K8s Manifests (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true

      # --- 3. Docker Metadata Extraction ---
      # Official Action: https://github.com/docker/metadata-action
      # Used to generate Docker tags and labels based on GitHub identifiers
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: oelmaamar/flask-api
          tags: |
            # Tag based on the git branch name
            type=ref,event=branch 
            # Tag based on the pull request
            type=ref,event=pr
            # Semantic versioning (e.g. v1.2.3)
            type=semver,pattern={{version}} 
            # Major and minor versioning (e.g. v1.2)
            type=semver,pattern={{major}}.{{minor}} 
            # Short commit SHA for traceability
            type=sha,format=short,prefix=sha-

      - name: Login to DockerHub
        if: github.event_name != 'pull_request' # Only login if this is not a pull request
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }} # Only push if this is not a pull request
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # --- 4. SOFTWARE COMPOSITION ANALYSIS (SCA) ---
      # Scans the final Docker image for known vulnerabilities (CVEs) in OS packages and libraries.
      # It will fail the build if CRITICAL vulnerabilities are found.
      # Documentation: https://github.com/aquasecurity/trivy-action

      - name: Container Scan (Trivy)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJson(steps.meta.outputs.json).tags[0] }}
          format: 'table'
          exit-code: '1' # Stop pipeline only if CRITICAL issues are found
          ignore-unfixed: true # don't list unfixed issues
          vuln-type: 'os,library'
          severity: 'CRITICAL'
    # --- 5. DEPLOY (On local k8s cluster) ---
      - name: Deploy to Local Cluster
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_TAG="${{ fromJson(steps.meta.outputs.json).tags[0] }}"

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/

          kubectl set image deployment/flask-api flask-api=$IMAGE_TAG -n devsecops

          kubectl rollout status deployment/flask-api -n devsecops --timeout=120s
          kubectl get pods -n devsecops
          kubectl get svc -n devsecops
